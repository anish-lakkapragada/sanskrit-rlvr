<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>og card — RLVR on Sanskrit</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Fragment+Mono&display=swap");

/* 1200x630 social card in the report's design system (see index.html) */
:root {
  --bg: #0e0e0a;
  --ink: #ededed;
  --muted: #8f8a80;
  --hairline: rgba(237, 237, 237, 0.16);
  --accent: #ff4200;
  --serif: "Source Serif 4", "Iowan Old Style", Georgia, serif;
  --mono: "Fragment Mono", "SF Mono", ui-monospace, Menlo, monospace;
}

* { box-sizing: border-box; }

html, body { margin: 0; padding: 0; }
html { background: #0e0e0a; height: 630px; overflow: hidden; }

body {
  position: relative;
  width: 1200px;
  height: 630px;
  overflow: hidden;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--serif);
  display: flex;
}

.topbar {
  position: absolute;
  top: 0;
  left: 0;
  width: 1200px;
  height: 6px;
  background: var(--accent);
}

.left {
  width: 480px;
  flex: none;
  padding: 0 0 0 56px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

h1 {
  margin: 0;
  font-weight: 400;
  font-size: 88px;
  line-height: 1.02;
  letter-spacing: -0.01em;
}

.subtitle {
  margin-top: 24px;
  color: var(--muted);
  font-style: italic;
  font-size: 28px;
  line-height: 1.35;
  max-width: 410px;
}

.right {
  flex: 1;
  padding: 56px 52px 48px 44px;
  display: flex;
  flex-direction: column;
}

.chart-head {
  font-weight: 600;
  font-size: 17px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 14px;
}

.chart-head .fig { color: var(--accent); margin-right: 12px; }

.legend { display: flex; flex-wrap: wrap; gap: 8px 24px; margin-bottom: 18px; }

.chip {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  font-family: var(--mono);
  font-size: 16px;
  color: #c9c5ba;
}

.chip .sw { width: 18px; height: 5px; border-radius: 2px; display: inline-block; }

.chart { flex: 1; }
svg { width: 100%; height: 100%; display: block; }

.gridline { stroke: rgba(237, 237, 237, 0.07); stroke-width: 1; }
.axisline { stroke: rgba(237, 237, 237, 0.18); stroke-width: 1; }
.tick { fill: var(--muted); font-family: var(--mono); font-size: 15px; }
.dlab { fill: #e5e2d8; font-family: var(--mono); font-size: 15.5px; paint-order: stroke; stroke: #0e0e0a; stroke-width: 4px; }
</style>
</head>
<body>

<div class="topbar"></div>

<div class="left">
  <h1>RLVR on Sanskrit</h1>
  <div class="subtitle">Fine-tuning Qwen3-8B with a Lean formalization of Sanskrit</div>
</div>

<div class="right">
  <div class="chart-head"><span class="fig">Fig. 1</span>Final benchmarks</div>
  <div class="legend" id="legend"></div>
  <div class="chart" id="chart"></div>
</div>

<script>
  const MODELS = [
    { id: "base", name: "Qwen3-8B (base)", color: "#4a86d8" },
    { id: "grpo_only", name: "GRPO only", color: "#a37c15" },
    { id: "sft",  name: "+ SFT",           color: "#3fa876" },
    { id: "chrf", name: "+ GRPO chrF++",   color: "#9a6bd8" },
    { id: "lean", name: "+ GRPO Lean (ours)", color: "#ff4200" }
  ];
  const METRICS = ["compile_rate", "exact_rate", "fix_rate", "cloze_exact"];
  const BARS = {
    compile_rate: [5.7, 11.4, 45.0, 45.7, 50.0],
    exact_rate:   [14.5, 22.7, 59.1, 65.5, 63.6],
    fix_rate:     [16.0, 26.0, 58.0, 64.0, 64.0],
    cloze_exact:  [18.7, 22.0, 34.7, 37.3, 33.3]
  };

  document.getElementById("legend").innerHTML = MODELS.map(m =>
    '<span class="chip"><span class="sw" style="background:' + m.color + '"></span>' + m.name + "</span>").join("");

  const NS = "http://www.w3.org/2000/svg";
  const el = (t, a) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); return e; };

  const W = 620, H = 420, L = 44, R = 4, T = 16, B = 34;
  const maxV = 70, pw = W - L - R, ph = H - T - B;
  const svg = el("svg", { viewBox: "0 0 " + W + " " + H, role: "img",
    "aria-label": "Grouped bar chart of final benchmark scores for five models" });
  const y = v => T + ph * (1 - v / maxV);
  for (let g = 0; g <= maxV; g += 10) {
    svg.appendChild(el("line", { x1: L, x2: W - R, y1: y(g), y2: y(g), class: g === 0 ? "axisline" : "gridline" }));
    const t = el("text", { x: L - 8, y: y(g) + 5, "text-anchor": "end", class: "tick" });
    t.textContent = g; svg.appendChild(t);
  }
  const slot = pw / METRICS.length, bw = 24, gap = 2;
  const groupW = MODELS.length * bw + (MODELS.length - 1) * gap;
  METRICS.forEach((met, gi) => {
    const x0 = L + gi * slot + (slot - groupW) / 2;
    MODELS.forEach((m, mi) => {
      const v = BARS[met][mi];
      const bx = x0 + mi * (bw + gap), by = y(v), bh = T + ph - by;
      const r = Math.min(4, bh);
      const d = "M" + bx + "," + (by + r) + " q0,-" + r + " " + r + ",-" + r +
        " h" + (bw - 2 * r) + " q" + r + ",0 " + r + "," + r +
        " v" + (bh - r) + " h-" + bw + " Z";
      svg.appendChild(el("path", { d: d, fill: m.color }));
      if (m.id === "lean") {
        const t = el("text", { x: bx + bw / 2, y: by - 8, "text-anchor": "middle", class: "dlab" });
        t.textContent = v; svg.appendChild(t);
      }
    });
    const lab = el("text", { x: x0 + groupW / 2, y: H - 10, "text-anchor": "middle", class: "tick" });
    lab.textContent = met; svg.appendChild(lab);
  });
  document.getElementById("chart").appendChild(svg);
</script>

</body>
</html>
