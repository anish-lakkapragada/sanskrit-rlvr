<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>og card — RLVR on Sanskrit</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Fragment+Mono&display=swap");

/* 1200x630 social card in the report's design system (see index.html) */
:root {
  --bg: #0e0e0a;
  --ink: #ededed;
  --muted: #8f8a80;
  --hairline: rgba(237, 237, 237, 0.16);
  --accent: #ff4200;
  --serif: "Source Serif 4", "Iowan Old Style", Georgia, serif;
  --mono: "Fragment Mono", "SF Mono", ui-monospace, Menlo, monospace;
}

* { box-sizing: border-box; }

html, body { margin: 0; padding: 0; }
html { background: #0e0e0a; height: 630px; overflow: hidden; }

body {
  position: relative;
  width: 1200px;
  height: 630px;
  overflow: hidden;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--serif);
  display: flex;
}

.topbar {
  position: absolute;
  top: 0;
  left: 0;
  width: 1200px;
  height: 6px;
  background: var(--accent);
}

.left {
  width: 540px;
  flex: none;
  padding: 64px 0 54px 60px;
  display: flex;
  flex-direction: column;
}

.kicker {
  color: var(--accent);
  font-weight: 600;
  font-size: 19px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  margin-bottom: 28px;
}

h1 {
  margin: 0;
  font-weight: 400;
  font-size: 92px;
  line-height: 1.02;
  letter-spacing: -0.01em;
}

.subtitle {
  margin-top: 24px;
  color: var(--muted);
  font-style: italic;
  font-size: 28px;
  line-height: 1.35;
  max-width: 440px;
}

.brand {
  margin-top: auto;
  padding-top: 22px;
  border-top: 1px solid var(--hairline);
  width: 440px;
  font-size: 24px;
}

.brand .deva { color: var(--accent); }
.brand .x { color: var(--muted); font-family: var(--mono); font-size: 17px; }
.brand .url { display: block; margin-top: 8px; font-family: var(--mono); font-size: 17px; color: var(--muted); }

.right {
  flex: 1;
  padding: 0 64px 0 30px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.chart-head {
  font-family: var(--mono);
  font-size: 16px;
  color: var(--muted);
  margin-bottom: 6px;
}

.chart-head .m { color: var(--ink); }

svg { width: 100%; height: auto; display: block; }

.axisline { stroke: rgba(237, 237, 237, 0.18); stroke-width: 1; }
.blab { fill: var(--muted); font-family: var(--mono); font-size: 17px; }
.dlab { fill: #e5e2d8; font-family: var(--mono); font-size: 24px; }
</style>
</head>
<body>

<div class="topbar"></div>

<div class="left">
  <div class="kicker">Technical Report</div>
  <h1>RLVR on Sanskrit</h1>
  <div class="subtitle">Fine-tuning Qwen3-8B with a Lean formalization of Sanskrit</div>
  <div class="brand">
    <span class="deva">संस्कृतम्</span> <span class="x">×</span> Lean&nbsp;4
    <span class="url">anishlk.com/sanskrit-rlvr</span>
  </div>
</div>

<div class="right">
  <div class="chart-head"><span class="m">compile_rate</span> — % accepted by the Lean checker</div>
  <svg viewBox="0 0 560 470" role="img" aria-label="Bar chart: compile rate of four models — base 5.7%, SFT 45%, GRPO chrF++ 45.7%, GRPO Lean (ours) 50%">
    <!-- bars: v/70 scaled to 360px above baseline y=400; 4px-radius rounded data ends -->
    <path d="M60,376.7 q0,-6 6,-6 h80 q6,0 6,6 V400 H60 Z" fill="#4a86d8"/>
    <path d="M176,174.6 q0,-6 6,-6 h80 q6,0 6,6 V400 H176 Z" fill="#3fa876"/>
    <path d="M292,171 q0,-6 6,-6 h80 q6,0 6,6 V400 H292 Z" fill="#9a6bd8"/>
    <path d="M408,148.9 q0,-6 6,-6 h80 q6,0 6,6 V400 H408 Z" fill="#ff4200"/>
    <text class="dlab" x="454" y="128" text-anchor="middle">50%</text>
    <line class="axisline" x1="40" x2="540" y1="400" y2="400"/>
    <text class="blab" x="106" y="434" text-anchor="middle">base</text>
    <text class="blab" x="222" y="434" text-anchor="middle">SFT</text>
    <text class="blab" x="338" y="434" text-anchor="middle">chrF++</text>
    <text class="blab" x="454" y="434" text-anchor="middle" fill="#ededed">Lean (ours)</text>
  </svg>
</div>

</body>
</html>
