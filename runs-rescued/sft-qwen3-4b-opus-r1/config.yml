run_name: sft-qwen3-4b-opus-r1
model: Qwen/Qwen3-4B
reward: vp_exact
dataset: data/finetune/task-data/finetune.json
eval_dataset: data/finetune/task-data/validation.json
seed: 42
pass_at_k:
  pass_threshold: 0.85
  temperature: 0.9
train:
  bf16: true
  gradient_checkpointing: true
  lora:
    r: 32
    alpha: 64
    dropout: 0.0
sft:
  dataset: data/finetune/sft/claude-opus-5.json
  prompt_template: v1/vp_task_eval.txt
  epochs: 2.0
  learning_rate: 0.0002
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  max_seq_len: 4096
  warmup_ratio: 0.05
  weight_decay: 0.01
  lr_scheduler: cosine
  eval_prompts_per_epoch: 16
  eval_samples_per_prompt: 4
  eval_max_new_tokens: 1024
_resolved:
  model_id: Qwen/Qwen3-4B
  prompt_version: 1
  git_sha: 8a18aa0
  argv:
  - /home/ubuntu/sanskrit/finetune/sft.py
  - --config
  - configs/sft-qwen3-4b.yml
  - --merge
  - --force
