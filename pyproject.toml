[project]
name = "sanskrit-vidyut"
version = "0.1.0"
description = "Fine-tuning Gemma on vidyut-prakriya morphology tasks (GRPO)"
readme = "README.md"
requires-python = ">=3.10"
# Base deps are CPU-installable everywhere (enable --dry-run + eval unit tests).
dependencies = [
    "pyyaml>=6.0",
    "numpy>=1.26",
    "sacrebleu>=2.4",
    "datasets>=2.19",
    "tensorboard>=2.16",
    "tensorboardX>=2.6",
    "vidyut>=0.4",   # SLP1->Devanagari for v1 prompt templates (lazy import)
]

[project.optional-dependencies]
# GPU box only: uv sync --extra train
# transformers>=5.5: gemma4 arch (old trl<=0.25 crashed under 5.x; trl 1.9 is fine).
# vllm<=0.25.1: trl 1.9's supported ceiling; 0.25.1 has Gemma4* registered.
train = [
    "torch>=2.4",
    "transformers>=5.5.3",
    "trl>=1.9",
    "peft>=0.12",
    "accelerate>=1.0",
    "bitsandbytes>=0.44",
    "vllm>=0.17,<=0.25.1",
]
