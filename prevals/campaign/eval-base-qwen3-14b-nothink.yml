# Scale probe: BASE Qwen3-14B on the VP task, native thinking OFF.
# Protocol identical to eval-base.yml (669x16, seed 42, v1 prompt, vp_exact
# >= 0.85, T 0.9, max_new_tokens 4096) so numbers are directly comparable to
# the dm-base-qwen3-4b origin row.

suite_name: dm-base-qwen3-14b-nothink

task:
  reward: vp_exact
  dataset: data/data-mixture/eval/vp-eval.json
  prompt: v1/vp_task_eval

seed: 42

pass_at_k:
  ks: [1, 2, 4, 8, 16]
  num_prompts: 669
  samples_per_prompt: 16
  pass_threshold: 0.85
  temperature: 0.9
  top_p: 1.0

defaults:
  max_new_tokens: 4096
  enable_thinking: false
  dtype: bfloat16
  tensor_parallel_size: 1
  gpu_memory_utilization: 0.90
  max_model_len: 8192
  trust_remote_code: false
  chat: true

models:
  - name: Qwen/Qwen3-14B

report:
  output_dir: prevals/outputs/data-mixture
  save_samples: true
  print_table: true
