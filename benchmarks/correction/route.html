<style>
#correction-route[hidden]{display:none}#correction-route{max-width:1360px;margin:auto;padding:20px 40px 50px}#correction-route iframe{display:block;width:100%;border:0;min-height:1000px;background:transparent}.correction-route-links{display:flex;flex-wrap:wrap;gap:10px 24px;font-size:12px;margin-bottom:10px}.correction-active header nav a[href="#/correction"]{color:var(--teal);font-weight:700}@media(max-width:760px){#correction-route{padding:18px}}@media print{#correction-route{padding:0}}
</style>
<div id="correction-route" hidden>
<div class="correction-route-links"><a href="#moving-forward">← Back to benchmark report</a><a href="correction/index.html" target="_blank" rel="noopener">Open correction page ↗</a></div>
<iframe id="correction-frame" title="200 correction tasks with verified answers" data-src="correction/index.html"></iframe>
</div>
<script>
(() => {
  const route=document.getElementById('correction-route');
  const frame=document.getElementById('correction-frame');
  const report=document.getElementById('top');
  function navigate(){
    const active=['#/correction','#correction'].includes(location.hash);
    route.hidden=!active;
    report.hidden=active;
    document.body.classList.toggle('correction-active',active);
    if(active&&!frame.getAttribute('src'))frame.src=frame.dataset.src;
    if(active)window.scrollTo({top:0,behavior:'instant'});
  }
  window.addEventListener('message',event=>{
    if(event.source!==frame.contentWindow||event.data?.type!=='vp-correction-height')return;
    const height=Number(event.data.height);
    if(Number.isFinite(height)&&height>0&&height<1000000)frame.style.height=`${Math.ceil(height)+8}px`;
  });
  window.addEventListener('hashchange',navigate);
  navigate();
})();
</script>
