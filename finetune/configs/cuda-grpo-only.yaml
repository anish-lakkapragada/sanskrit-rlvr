# Ablation arm: GRPO directly on the base model — no SFT cold start.
# Same recipe as cuda-sft-then-grpo (LoRA, vLLM rollouts, Lean reward);
# the literature and the base model's 1.9% compile-rate predict the
# format/partial-credit reward climbs while compile-rate stays near the
# floor — this run measures that (see the zero-RL / R1-Zero discussion).
run_name: cuda-grpo-only
backend: cuda
mode: grpo
model:
  base: Qwen/Qwen3-4B-Instruct-2507
  init_from_run: null   # KL reference = the raw base (adapter disabled)
  final_checkpoint: runs/cuda-grpo-only/checkpoints/final
data:
  dir: data/in_fragment/grpo
hyperparameters:
  reward: lean            # GRPO training signal: the Lean checker (RLVR)
  learning_rate: 8.0e-6
  iters: 1500
  batch_size: 1
  num_layers: 16
  lora_rank: 8
  lora_alpha: 80
  max_seq_length: 768
  group_size: 8
  beta: 0.1
  temperature: 0.8
  max_completion_length: 200
  use_vllm: true
  vllm_gpu_memory_utilization: 0.25
eval:
  benchmarks:
    in_fragment: data/in_fragment/eval.jsonl
    out_of_fragment: data/out_of_fragment/eval.jsonl
  every: 100
  samples: null
  temperature: 0.0
dashboard:
  enabled: true
  port: 8777
