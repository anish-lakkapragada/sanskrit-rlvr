# Arm 1 on CUDA: full-parameter SFT in bf16 — no LoRA bottleneck, no
# quantization. The final checkpoint doubles as the base (and KL reference)
# for cuda-sft-then-grpo.yaml.
run_name: cuda-sft-baseline
backend: cuda
mode: sft
model:
  base: Qwen/Qwen3-4B-Instruct-2507
  init_from_run: null
  final_checkpoint: runs/cuda-sft-baseline/checkpoints/final
data:
  dir: data/in_fragment/sft
hyperparameters:
  learning_rate: 1.0e-5   # full-parameter: ~10x below the LoRA recipe
  iters: 1000
  batch_size: 4
  max_seq_length: 768
eval:
  benchmarks:             # all metrics on both, at every eval point
    in_fragment: data/in_fragment/eval.jsonl        # 150 rows, Lean + chrF++/TER
    out_of_fragment: data/out_of_fragment/eval.jsonl  # 36 rows, chrF++/TER
  every: 100              # checkpoint + full eval every N iterations
  samples: null           # per-benchmark row cap; null = whole file
  temperature: 0.0
dashboard:
  enabled: true
  port: 8777
