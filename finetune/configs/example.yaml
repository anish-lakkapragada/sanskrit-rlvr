# =============================================================================
# Example fine-tuning configuration — every field documented.
# Copy this file, change run_name, and launch with:
#
#     bash finetune/run.sh finetune/configs/<your-copy>.yaml
#
# Everything the run produces lands under runs/<run_name>/:
#     config.yaml      frozen copy of this file
#     train.log        raw trainer output
#     checkpoints/     LoRA adapter checkpoints (4 across the run + final)
#     metrics.jsonl    one line per checkpoint: compile-rate, chrF++, reward
#     snapshots/       the model's actual generations at each checkpoint
# =============================================================================

# Unique name for this experiment. Names the runs/<run_name>/ directory;
# a run refuses to start if that directory already exists.
run_name: example

# Training backend.
#   "mlx"  — Apple Silicon (mlx-lm-lora): LoRA for both modes, 4-bit base.
#   "cuda" — Lambda-class GPUs (TRL): full-parameter SFT, LoRA GRPO with
#            vLLM rollouts. bf16 everywhere — no quantization.
backend: mlx

# "sft"  — supervised fine-tuning on chat-format data (data/in_fragment/sft/)
# "grpo" — RLVR: the model samples answers, the Lean checker scores them,
#          GRPO reinforces above-average samples (data/in_fragment/grpo/)
mode: sft

model:
  # HF repo id or local path of the base model. Match it to the backend:
  #   mlx:  mlx-community/Qwen3-4B-Instruct-2507-4bit   (pre-quantized)
  #   cuda: Qwen/Qwen3-4B-Instruct-2507                 (bf16, unquantized)
  base: mlx-community/Qwen3-4B-Instruct-2507-4bit
  # Optional: initialize from a previous run instead of the raw base —
  # the canonical SFT→GRPO pipeline. On cuda the named run's final
  # full-model checkpoint simply becomes this run's base (and GRPO's KL
  # reference), losslessly. On mlx the named run's final adapter is fused
  # into its base and re-quantized to 4-bit (a measured cost, reported in
  # metrics.jsonl as the "init" entry). null = train from model.base.
  init_from_run: null
  # Where the final trained model lands (cuda; repo-relative or absolute).
  # null = runs/<run_name>/checkpoints/final. Chained runs (init_from_run)
  # and evaluate.py resolve the source model through this same key.
  final_checkpoint: null

data:
  # Directory containing train.jsonl and valid.jsonl in the format that
  # matches `mode` (see data/README.md).
  dir: data/in_fragment/sft

hyperparameters:
  # --- common ---------------------------------------------------------------
  # LoRA SFT (mlx) default 1e-4; full-parameter SFT (cuda) wants ~1e-5;
  # the stable GRPO recipe uses 8e-6 on either backend.
  learning_rate: 1.0e-4
  iters: null             # explicit iteration count; null (SFT only) = derive
  epochs: 2               # from epochs × dataset size ÷ batch_size
  batch_size: 2           # GRPO uses 1 (each item spawns group_size samples)
  num_layers: 16          # transformer layers that get LoRA adapters
                          # (cuda SFT is full-parameter: ignored there)
  max_seq_length: 768
  # --- LoRA shape, cuda GRPO only (mlx pins these in mlx-lm) -----------------
  lora_rank: 8
  lora_alpha: 80          # peft scales by alpha/rank; 10×rank matches mlx
  # --- GRPO only (ignored for SFT) -------------------------------------------
  # The training reward signal, and the experiment's key switch:
  #   lean — the Lean checker judges each sample (verified reward / RLVR)
  #   chrf — chrF++ similarity to the reference (non-verified control;
  #          same 0.15·format + 0.85·task shape, no compiler involved)
  reward: lean
  group_size: 6           # samples per prompt; advantage = vs group mean
  beta: 0.1               # KL leash to the reference (= this run's base)
  temperature: 0.8        # sampling temperature during rollouts
  max_completion_length: 200
  # --- cuda GRPO rollout engine ----------------------------------------------
  use_vllm: true          # vLLM colocated on the training GPU; false = slow
                          # transformers fallback (debugging only)
  vllm_gpu_memory_utilization: 0.25

eval:
  # Every benchmark group runs in full at every eval point; each group gets
  # its own summary object in metrics.jsonl and its own file under
  # snapshots/checkpoint_<it>/. in_fragment rows are judged by Lean
  # (compile-rate, QA exact, reward) + chrF++/TER; out_of_fragment rows by
  # chrF++/TER only. On cuda the eval runs LIVE inside training (scores
  # stream to TensorBoard as they happen); on mlx it runs after training.
  benchmarks:
    in_fragment: data/in_fragment/eval.jsonl
    out_of_fragment: data/out_of_fragment/eval.jsonl
  # One knob for telemetry cadence: save a checkpoint AND run the full
  # eval every N iterations. (Checkpoint 0 = the untrained starting point
  # is always measured too.)
  every: 100
  samples: null                # per-benchmark row cap; null = whole file
  temperature: 0.0             # greedy decoding for evaluation
  # Legacy fields still accepted: `prompts` (single in-fragment file),
  # `checkpoints: N` (cadence = iters/N), `samples_per_checkpoint`.

dashboard:
  # Live view of the run at http://localhost:<port> — reward curve from
  # train.log, checkpoint metrics, and the latest sample generations with
  # their Lean verdicts. Auto-refreshes; watches all runs, not just this one.
  enabled: true
  port: 8777
