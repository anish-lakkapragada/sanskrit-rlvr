# Arm 1 of the report: pure supervised fine-tuning on answers the Lean
# grammar generates for itself (zero human labels).
run_name: sft-baseline
backend: mlx
mode: sft
model:
  base: mlx-community/Qwen3-4B-Instruct-2507-4bit
  init_from_run: null
data:
  dir: data/in_fragment/sft
hyperparameters:
  learning_rate: 1.0e-4
  epochs: 2
  batch_size: 2
  num_layers: 16
  max_seq_length: 768
eval:
  benchmarks:             # all metrics on both, at every eval point
    in_fragment: data/in_fragment/eval.jsonl        # 150 rows, Lean + chrF++/TER
    out_of_fragment: data/out_of_fragment/eval.jsonl  # 36 rows, chrF++/TER
  every: 100              # checkpoint + full eval every N iterations
  samples: null           # per-benchmark row cap; null = whole file
  temperature: 0.0
dashboard:
  enabled: true
  port: 8777
