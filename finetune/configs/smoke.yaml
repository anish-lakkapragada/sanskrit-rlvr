# Framework smoke test: tiny SFT run that must produce a complete
# runs/smoke/ (4 checkpoints, 4 metrics lines, 4 snapshot files) in a few
# minutes. Run this after any framework change, before real experiments.
run_name: smoke
backend: mlx
mode: sft
model:
  base: mlx-community/Qwen3-4B-Instruct-2507-4bit
  init_from_run: null
data:
  dir: data/sft
hyperparameters:
  learning_rate: 1.0e-4
  iters: 8
  batch_size: 2
  num_layers: 4
  max_seq_length: 512
eval:
  prompts: data/eval/in_fragment.jsonl
  samples_per_checkpoint: 6
  temperature: 0.0
  checkpoints: 4
dashboard:
  enabled: true
  port: 8777
