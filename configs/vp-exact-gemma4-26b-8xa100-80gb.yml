# 8x A100 80GB — gemma4-26b, UNQUANTIZED bf16, LoRA GRPO on the vp_exact
# reward. Layout: GPUs 0-6 train (DDP), GPU 7 runs a vllm-serve process.
#
# Why server mode and not colocate: two bf16 copies are ~106GB and will not
# share an 80GB card. One copy is 53GB, so each training rank holds a full
# model (no FSDP/ZeRO needed) and rollouts come from a dedicated GPU.
#
#   per training GPU   53GB weights + LoRA optim + activations   ~60GB / 80GB
#   vLLM GPU (7)       53GB weights + ~19GB KV (util 0.9)        ~72GB / 80GB
#
# Batch math: trl requires the EFFECTIVE batch (per_device * grad_accum *
# num_processes) to be divisible by num_generations. 7 processes is coprime
# with 8, so per_device * grad_accum must itself be a multiple of 8:
#   2 * 4 * 7 = 56 completions = 7 prompts x 8 generations per generation batch.
#
# LoRA reaches 205 Linears (attention + dense MLP). It cannot reach the 22.8B
# of expert weights -- gemma4 keeps them in a fused Gemma4TextExperts module
# as raw Parameters, not nn.Linear -- so those stay frozen by construction.
#
# launch: bash misc/launch_8xa100.sh   (starts vllm-serve, waits, then trains)

run_name: vp-exact-gemma4-26b
model: gemma4-26b               # google/gemma-4-26B-A4B-it (ungated)
reward: vp_exact
dataset: data/finetune/finetune.json         # 6,018 training tasks
eval_dataset: data/finetune/validation.json  # Pass@K prompt pool (held-out dhatus)

iterations: 1000
checkpoint_every: 100
logging_every: 10
seed: 42

pass_at_k:
  ks: [1, 4, 8]
  num_prompts: 128
  samples_per_prompt: 8
  pass_threshold: 0.85       # pass iff content exact-matches (>= 0.85 even with failed format)
  temperature: 0.9

samayik_eval:
  path: data/eval/samayik.json
  num_samples: 200
  max_new_tokens: 512
  temperature: 0.2

generation:
  num_generations: 8
  max_completion_length: 256
  temperature: 0.9

train:
  learning_rate: 1.0e-5
  per_device_train_batch_size: 2   # counts COMPLETIONS; see batch math above
  gradient_accumulation_steps: 4
  beta: 0.04
  bf16: true
  gradient_checkpointing: true
  quantization: none         # unquantized: bnb cannot touch the fused experts anyway
  lora:
    r: 16
    alpha: 32
    dropout: 0.05

vllm:
  mode: server
  server_host: 127.0.0.1     # vllm-serve runs on GPU 7 of this same box
  server_port: 8000
  max_model_length: 2048     # gemma4 advertises 262k; vLLM reserves KV for it
  gpu_memory_utilization: 0.9  # server owns GPU 7 outright
