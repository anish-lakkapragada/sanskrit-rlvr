# 1x A100 40GB — gemma3-12b with the vp_exact reward. QLoRA profile: the
# trainable base copy is bnb NF4 (~8GB); under trl>=1.0 the colocated vLLM
# engine is then also loaded with in-flight bitsandbytes quantization
# (~7GB weights), leaving ample KV room inside the 0.6 utilization slice.
# launch: uv run python -m finetune.grpo --config configs/vp-exact-gemma3-12b-1xa100.yml

run_name: vp-exact-gemma3-12b
# google/gemma-3-12b-it (the gemma3-12b preset) is a gated repo and no HF
# token is available; unsloth/gemma-3-12b-it is a byte-identical ungated
# mirror (same arch/params). Swap back to the preset once a token exists.
model: unsloth/gemma-3-12b-it
reward: vp_exact
dataset: data/finetune/task-data/finetune.json         # 6,018 training tasks
eval_dataset: data/finetune/task-data/validation.json  # Pass@K prompt pool (held-out dhatus)

iterations: 1000
checkpoint_every: 100
logging_every: 10
seed: 42

pass_at_k:
  ks: [1, 4, 8]
  num_prompts: 64            # smaller: eval generation is slower on one GPU
  samples_per_prompt: 8
  pass_threshold: 0.85       # pass iff content exact-matches (>= 0.85 even with failed format)
  temperature: 0.9

samayik_eval:
  path: data/eval/samayik.json
  num_samples: 100
  max_new_tokens: 512
  temperature: 0.2

generation:
  num_generations: 8
  max_completion_length: 256
  temperature: 0.9

train:
  learning_rate: 1.0e-5
  # Counts COMPLETIONS. trl>=1.0 requires the EFFECTIVE batch (per_device *
  # grad_accum * num_processes) to be divisible by num_generations, not
  # per_device alone -- so 2x4 == one 8-generation group per optimizer step,
  # at a quarter of the peak logits memory. Gemma-3's 262k vocab makes those
  # logits the binding constraint on a 40GB card, not the weights.
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 4
  beta: 0.04
  bf16: true
  gradient_checkpointing: true
  quantization: 4bit
  lora:
    r: 16
    alpha: 32
    dropout: 0.05

vllm:
  mode: colocate
  # The engine inherits the trainer's bnb 4-bit weights (~7.5GB), so 0.45
  # still leaves ~10GB of KV cache while freeing ~6GB for the backward pass.
  gpu_memory_utilization: 0.45
  max_model_length: 2048       # vs the 131k default: ~250-token prompts, <=512 new
