# SDPO (pure self-distillation, top-K KL, NO GRPO advantage term) from the
# 20M·67%-samayik mixture policy — GRPO-r3's exact start, batch shape (8
# prompts x 8 rollouts/step via torchrun DDP-8), box (8x A100-80GB), and eval
# protocol, with the algorithm swapped and the privileged context sourced from
# the rejection-sampled Opus 5 traces (all traces vp_exact == 1.0).
#
# Naming: grpo-vp-exact-mixture-tb20m-samayik67 with GRPO -> SDPO (user rule).
#
# Paper-faithfulness (arXiv:2601.20802): reverse KL(student || stopgrad(teacher))
# = Eq. 1; top-K distillation K=100 + tail bucket = section 2.2/4.2; the FULL
# rollout group is distilled (Algorithm 1; max_distill_rollouts: 8 = group
# size, skip_all_correct: false). Known deviations, on purpose: answer-block
# tokens weighted 2x (repo convention; paper is uniform), plain KL rather than
# JSD + EMA teacher (paper section 2.3 — first knobs to reach for if unstable).
#
# Data: data/finetune/task-data/sdpo-opus-finetune.json — built by
# misc/data/make_sdpo_opus_data.py. 4,564/6,018 tasks kept (75.84% Opus
# coverage; 0 over the 2,048-token budget; blocks mean 688 / p90 1,314 /
# max 2,000 tokens). One epoch at 8 prompts/step = 571 optimizer steps.
#
# Baselines to beat (the SFT start's clean-eval row):
#   pass@1 46.15 [43.59, 48.70] / pass@16 84.75 / samayik chrF 41.29 / FLORES 22.97
#
# Launch (on the box, from the repo root):
#   torchrun --nproc-per-node 8 -m finetune.sdpo --config configs/sdpo-opus-r1.yml --force
# Preflight (local, CPU):
#   uv run --with transformers python -m finetune.sdpo --config configs/sdpo-opus-r1.yml --dry-run
#
# Step-0 probe must read >= 0.40 pass@1 or the trainer aborts itself (the SFT
# start reads ~0.46; the old 0.55 gate was written for the mix2 policy).
# Checkpoints + full eval suite (pass@k, samayik chrF/chrF++, FLORES-200
# chrF/chrF++) at steps 54, 108, ..., 540 and the final step 571.

run_name: sdpo-vp-exact-mixture-tb20m-samayik67
model: /home/ubuntu/sanskrit/tb20m-samayik67-merged   # fresh merge; chmod read-only
reward: vp_exact          # rollout gate + probe scoring
eval_reward: vp_exact
prompt_template: v1/vp_task_eval.txt
dataset: data/finetune/task-data/sdpo-opus-finetune.json
eval_dataset: data/finetune/task-data/validation.json   # 669 held-out dhatus (== r3's vp-eval.json)

iterations: 571           # one epoch: ceil(4564 / 8)
checkpoint_every: 54      # r3 cadence; 10 in-run checkpoints + final step-571
logging_every: 10
seed: 42

sdpo:
  privileged_budget: 2048       # build-time budget (documentation; enforced at build)
  kl_direction: reverse         # paper Eq. 1: KL(student || stopgrad(teacher))
  kl_temperature: 1.0
  top_k: 100                    # top-K distillation (student top-100 + tail bucket)
  kl_clamp: 3.0                 # per-token KL cap (nats); tames structural-token outliers
  thinking_block_weight: 1.0
  answer_block_weight: 2.0
  skip_all_correct: false       # paper-faithful: all-correct groups still distill
  gate_threshold: 0.85          # vp_exact pass level (rollout pass-rate telemetry)
  max_distill_rollouts: 8       # = num_generations: distill the ENTIRE group
  step0_min_pass1: 0.40         # abort gate (SFT start ~0.46; catches bad merges)
  weight_sync_every: 5          # rollouts <=4 steps stale; SDPO tolerates staleness
  logits_chunk: 512             # fp32 KL computed 512 tokens at a time (memory)
  warmup_ratio: 0.03
  lr_scheduler: constant_with_warmup
  grad_clip: 1.0
  weight_decay: 0.0

train:
  learning_rate: 5.0e-5         # 5x GRPO's starved 1e-5 (dense per-token signal)
  per_device_train_batch_size: 1   # one prompt per rank per step (DDP-8 -> global 8)
  gradient_accumulation_steps: 1
  beta: 0.0                     # unused by SDPO (no KL-to-reference term)
  bf16: true
  gradient_checkpointing: true
  lora:
    r: 64                       # matches the mixture arms' + r3's geometry
    alpha: 128                  # scaling alpha/r = 2.0
    dropout: 0.0                # determinism keeps DDP replicas in lockstep

generation:                     # student rollouts (per rank: 1 prompt x 8)
  num_generations: 8
  max_completion_length: 4096
  temperature: 0.9

vllm:                           # one colocated engine per rank (functional
  mode: colocate                # weight push — trainer weights never mutated)
  gpu_memory_utilization: 0.35  # 80GB ranks: ~28GB engine + ~13GB trainer, comfortable
  max_model_length: 7168        # prompt (~372) + privileged block (<=2048) + 4096 + headroom

pass_at_k:                      # probe protocol — identical to the GRPO runs
  ks: [1, 2, 4, 8]
  num_prompts: 64
  samples_per_prompt: 8
  pass_threshold: 0.85
  temperature: 0.9

samayik_eval:                   # r3 convention: seeded 100-pair subset in-run,
  path: data/data-mixture/eval/samayik-eval.json   # full 750 at the final eval
  num_samples: 100
  max_new_tokens: 2048
  temperature: 0.2

flores_eval:                    # NEW: FLORES-200 tracked at every checkpoint,
  path: data/data-mixture/eval/flores-200.json     # same chrF/chrF++ protocol
  num_samples: 100
  max_new_tokens: 2048
  temperature: 0.2
