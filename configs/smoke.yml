# Tiny infrastructure smoke test for a single A100 40GB — verifies the whole
# pipeline (model load, vLLM colocate, GRPO steps, checkpointing, evals, TB)
# in a few minutes. NOT a real training run.
# launch: python -m finetune.grpo --config configs/smoke.yml

run_name: smoke-a100
# unsloth mirror = same weights as google/gemma-3-12b-it but not license-gated
# (no HF token needed). Switch back to the gemma3-12b preset once HF_TOKEN is set.
model: unsloth/gemma-3-12b-it
reward: vp_exact
dataset: data/finetune/task-data/finetune.json
eval_dataset: data/finetune/task-data/validation.json

iterations: 4
checkpoint_every: 2
logging_every: 1
seed: 42

pass_at_k:
  ks: [1, 4]
  num_prompts: 8
  samples_per_prompt: 4
  pass_threshold: 0.5
  temperature: 0.9

samayik_eval:
  path: data/eval/samayik.json
  num_samples: 8
  max_new_tokens: 256
  temperature: 0.2

generation:
  num_generations: 4           # group size G
  max_completion_length: 192
  temperature: 0.9

train:
  learning_rate: 1.0e-5
  # Counts COMPLETIONS. trl>=1.0 requires the EFFECTIVE batch (per_device *
  # grad_accum) to be divisible by G, not per_device alone. Keep the micro-batch
  # small: gemma-3's 262k vocab makes logits, not weights, the memory ceiling.
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 2
  beta: 0.04
  bf16: true
  gradient_checkpointing: true
  quantization: 4bit
  lora:
    r: 16
    alpha: 32
    dropout: 0.05

vllm:
  mode: colocate
  # The engine inherits the trainer's bnb 4-bit weights (~7.5GB), so it does not
  # need a bf16-sized pool; the rest is left for the backward pass.
  gpu_memory_utilization: 0.45
  max_model_length: 2048   # vs gemma-3's 131k default, which blocks engine start
